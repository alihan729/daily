<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eaeef1;--card:#ffffff;--ink:#1d2a31;--muted:#6a7883;--line:#e3e9ee;
  --primary:#12a594;--primary-ink:#0c7d70;--ok:#12a594;
  --chip-bg:rgba(18,165,148,.12);
  --alert-bg:#fff4e5;--alert-ink:#a9640c;--alert-line:#f4d3a3;
  --danger:#c0392b;--danger-line:#e2b4b4;
  --shadow:0 1px 2px rgba(20,40,50,.05),0 6px 16px rgba(20,40,50,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1417;--card:#19222a;--ink:#e8eef2;--muted:#93a3ad;--line:#28343c;
  --primary:#1ab39f;--primary-ink:#7fe0d3;--ok:#1ab39f;
  --chip-bg:rgba(26,179,159,.16);
  --alert-bg:#2a2114;--alert-ink:#f0c07a;--alert-line:#4a3a20;
  --danger:#ff8a7a;--danger-line:#5a3030;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
}}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:78px;line-height:1.35}
.appbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:13px 18px;font-weight:800;font-size:16px;letter-spacing:-.2px}
main{max-width:640px;margin:0 auto;padding:16px 14px 24px}
.screen.hidden{display:none}

/* Today header */
.today-head .today-label{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.today-head .today-date{font-size:17px;font-weight:600;margin-top:2px}
.today-head .daynum{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:5px}

.banner{margin:14px 0;background:var(--alert-bg);color:var(--alert-ink);border:1px solid var(--alert-line);
  border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
.notice{background:var(--alert-bg);color:var(--alert-ink);border:1px solid var(--alert-line);
  border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;font-weight:600}

.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);margin-bottom:20px}
.summary-row{display:flex;justify-content:space-between;font-weight:700;margin-bottom:11px;font-size:15px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .35s ease}
.bar-fill.ok{background:var(--ok)}

/* Blocks */
.block{margin-bottom:20px}
.block-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 10px}
.block-icon{font-size:18px}
.block-title{font-weight:800;font-size:17px;letter-spacing:-.2px}
.block-sub{color:var(--muted);font-size:13px}
.block-note{font-size:12.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);
  border-radius:10px;padding:9px 12px;margin:0 0 10px;line-height:1.5}

/* Task cards */
.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.task.clickable{cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .06s ease,border-color .15s}
.task.clickable:active{transform:scale(.99)}
.task.on{border-color:var(--primary)}
.task .check{width:26px;height:26px;flex:none;border:2px solid var(--line);border-radius:8px;
  display:grid;place-items:center;transition:.15s}
.task .check.on{background:var(--primary);border-color:var(--primary)}
.task .check.on::after,.task .check.done::after{content:"";width:6px;height:11px;border:solid #fff;
  border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:-2px}
.task .check.done{background:var(--muted);border-color:var(--muted)}
.task .check.rest{border-style:dashed;color:var(--muted);font-weight:800;font-size:15px;line-height:1}
.task .body{flex:1;min-width:0}
.task .nameline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;row-gap:5px}
.task .name{font-weight:600;font-size:15px}
.task .detail{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.ttag{flex:none;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:1.6}
.ttag.during{color:var(--primary-ink);background:var(--chip-bg)}
.ttag.after{color:#b9770f;background:rgba(214,150,40,.18)}
.ttag.before{color:#3b7bd6;background:rgba(70,130,240,.18)}
.ttag.free{color:var(--muted);background:var(--line)}
.task .chips{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.task .chip{font-size:12px;font-weight:700;color:var(--primary-ink);background:var(--chip-bg);
  padding:4px 9px;border-radius:99px;white-space:nowrap}
.task .chip.muted{color:var(--muted);background:var(--line)}
.task .chip-sub{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;padding-right:4px}
.task.done{opacity:.58}
.task.rest{opacity:.72;border-style:dashed}

/* Progress + history headers */
.p-head{margin-bottom:16px}
.p-head .date{font-size:24px;font-weight:800;letter-spacing:-.5px}
.p-head .daynum{color:var(--muted);font-size:14px;margin-top:4px}

.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.prow{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:15px}
.pname{font-weight:600}
.pval{font-weight:700;color:var(--muted);white-space:nowrap}
.pval.ok{color:var(--ok)}
.pval.muted{font-weight:600}
.pcard.routine{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.psub{color:var(--muted);font-size:12.5px;margin-top:9px;line-height:1.4}
.p-sub{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  margin:22px 4px 10px}
.pcard.appt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.pcard.appt .adate{font-weight:600;font-size:15px}
.pcard.appt .aleft{font-weight:700;color:var(--primary-ink);white-space:nowrap;font-size:14px}
.pcard.appt.past{opacity:.55}
.pcard.appt.past .aleft{color:var(--muted)}

/* History */
.hday{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  box-shadow:var(--shadow);overflow:hidden}
.hday summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  cursor:pointer;list-style:none;font-size:14px;gap:10px}
.hday summary::-webkit-details-marker{display:none}
.hdate{font-weight:600}
.hcount{font-weight:700;color:var(--muted);white-space:nowrap}
.hcount.ok{color:var(--ok)}
.hbody{padding:0 14px 12px;color:var(--muted);font-size:13px;line-height:1.7}

/* Settings */
.setcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  margin-bottom:12px;box-shadow:var(--shadow)}
.setlabel{font-weight:700;font-size:15px;display:block;margin-bottom:10px}
input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit}
.apptrow{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.apptrow input[type=date]{width:auto;flex:1 1 42%;min-width:0;padding:10px;font-size:14px}
.apptrow .atext{flex:1 1 42%;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.apptrow .del{flex:none;width:38px;height:40px;border:1px solid var(--danger-line);color:var(--danger);
  background:transparent;border-radius:10px;font-size:20px;line-height:1;cursor:pointer}
.apptrow .del:active{transform:scale(.95)}
.hint{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.99)}
.btn-danger{background:transparent;border-color:var(--danger-line);color:var(--danger)}
.about{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.5}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tab{flex:1;background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.tab .ti{font-size:19px;line-height:1;filter:grayscale(.4);opacity:.8}
.tab.active{color:var(--primary-ink)}
.tab.active .ti{filter:none;opacity:1}

/* Toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(18px);
  background:#222c33;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.28);max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="appbar">🧴 Трекер лечения</header>

<main>
  <section id="screen-today" class="screen"></section>
  <section id="screen-progress" class="screen hidden"></section>
  <section id="screen-history" class="screen hidden"></section>
  <section id="screen-settings" class="screen hidden"></section>
</main>

<nav class="tabs">
  <button class="tab active" data-screen="today"><span class="ti">🗓️</span><span>Сегодня</span></button>
  <button class="tab" data-screen="progress"><span class="ti">📊</span><span>Прогресс</span></button>
  <button class="tab" data-screen="history"><span class="ti">📜</span><span>История</span></button>
  <button class="tab" data-screen="settings"><span class="ti">⚙️</span><span>Настройки</span></button>
</nav>

<div id="toast" class="toast"></div>

<script>
'use strict';
const KEY = 'acneTracker.v1';
const SCHEMA = 3; // версия данных (для миграций)
const DEFAULT_START = '2026-08-31'; // старт курса — 31 августа 2026
// Приёмы у врача по умолчанию (редактируются в «Настройках»)
const DEFAULT_APPTS = [
  { date:'2026-10-05', label:'5–6 октября 2026' },
];

/* ---- Данные курса ---- */
const BLOCKS = [
  { id:'morning',   title:'Утро',    subtitle:'после пробуждения', icon:'🌅' },
  { id:'breakfast', title:'Завтрак', subtitle:'у каждого свой момент', icon:'🍳',
    note:'Не глотать всё разом — у каждой таблетки своя пометка: во время / после еды / отдельно.' },
  { id:'day',       title:'День',    subtitle:'16:00–18:00',       icon:'☀️',
    note:'Базирон: первые 14 дней — через день (в «пустой» день карточка станет «пропуск»), с 15-го дня — каждый день.' },
  { id:'dinner',    title:'Ужин',    subtitle:'во время еды',      icon:'🍽️' },
  { id:'evening',   title:'Вечер',   subtitle:'перед сном',        icon:'🌙' },
];

// Пометка «когда относительно еды» — цветной тег на карточке
const TIMING = {
  before: { t:'до еды',             c:'before' },
  during: { t:'во время еды',       c:'during' },
  after:  { t:'после еды',          c:'after'  },
  free:   { t:'без привязки к еде',  c:'free'   },
};

// duration: длительность в днях; null = без ограничения (рутина)
const TASKS = [
  { id:'wash_am',    block:'morning',   name:'Умывание',               detail:'Bioderma Sensibio · гель, умыться тёплой водой',            duration:null },
  { id:'moist_am',   block:'morning',   name:'Увлажняющий крем',       detail:'Тонкий слой на всё лицо · Avène Комедомед / Dr. Althea 345', duration:null },
  { id:'spf_am',     block:'morning',   name:'SPF 50+',                detail:'Последний шаг, после крема · Avène / Bioderma / Beauty of Joseon', duration:null },

  { id:'vitd',       block:'breakfast', name:'Витамин Д 5000 МЕ',      detail:'1 таблетка · обязательно до 12:00',              timing:'during', duration:90 },
  { id:'ursosan_am', block:'breakfast', name:'Урсосан 250 мг',         detail:'1 таблетка · 1-й приём из 2 за день',            timing:'during', duration:14 },
  { id:'unidox',     block:'breakfast', name:'Юнидокс Солютаб 100 мг', detail:'1 таблетка · не натощак',                       timing:'after',  duration:28 },
  { id:'zinc',       block:'breakfast', name:'Цинк пиколинат 50 мг',   detail:'1 таблетка · лучше не одновременно с Юнидоксом', timing:'free',   duration:60 },

  { id:'baziron',    block:'day',       name:'Базирон АС 2.5%',        detail:'Тонкий слой только на высыпания · ориентир 16:00–18:00',    duration:56, special:'baziron' },

  { id:'ursosan_pm', block:'dinner',    name:'Урсосан 250 мг',         detail:'1 таблетка · 2-й приём из 2 за день',            timing:'during', duration:14 },

  { id:'wash_pm',    block:'evening',   name:'Умывание',               detail:'Bioderma Sensibio · гель, умыться тёплой водой',            duration:null },
  { id:'klenzit',    block:'evening',   name:'Клензит С',              detail:'Тонкий слой на всё лицо · на ночь, перед сном',             duration:56 },
  { id:'moist_pm',   block:'evening',   name:'Увлажняющий крем',       detail:'Тонкий слой на всё лицо · Avène Комедомед / Dr. Althea 345', duration:null },
];

const COURSE_MEDS = [
  { name:'Юнидокс Солютаб 100 мг', duration:28 },
  { name:'Урсосан 250 мг',         duration:14 },
  { name:'Витамин Д 5000 МЕ',      duration:90 },
  { name:'Цинк пиколинат 50 мг',   duration:60 },
  { name:'Базирон АС 2.5%',        duration:56 },
  { name:'Клензит С',              duration:56 },
];
const ROUTINE = ['Умывание — Bioderma Sensibio', 'Увлажняющий крем', 'SPF (утром)'];

/* ---- Работа с датами ---- */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const p=k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function todayKey(){ return keyOf(new Date()); }
function dayDiff(aKey,bKey){ return Math.round((parseKey(bKey)-parseKey(aKey))/86400000); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function fmt(k,opts){ return parseKey(k).toLocaleDateString('ru-RU', opts||{day:'numeric',month:'long',year:'numeric'}); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function plural(n,one,few,many){ const a=Math.abs(n)%100,b=a%10; if(a>10&&a<20)return many; if(b>1&&b<5)return few; if(b===1)return one; return many; }
function daysWord(n){ return plural(n,'день','дня','дней'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---- Приёмы у врача ---- */
function sortedAppts(){ return (state.appointments||[]).filter(a=>a&&a.date).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function apptText(a){ return (a.label && a.label.trim()) ? esc(a.label.trim()) : cap(fmt(a.date)); }
function apptCountdown(a){ const d=dayDiff(todayKey(),a.date); if(d>0) return 'через '+d+' '+daysWord(d); if(d===0) return 'сегодня'; return (-d)+' '+daysWord(-d)+' назад'; }
function nextAppt(){ const t=todayKey(); const up=sortedAppts().filter(a=>dayDiff(t,a.date)>=0); return up.length?up[0]:null; }

/* ---- Состояние ---- */
let state = { startDate: DEFAULT_START, appointments: DEFAULT_APPTS.map(a=>({...a})), history:{} };
let lastRenderedDay = ''; // для авто-обновления при смене реального дня
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw);
      if(p && typeof p==='object'){
        if(typeof p.startDate==='string') state.startDate = p.startDate;
        if(Array.isArray(p.appointments)) state.appointments = p.appointments;
        state.history = (p.history && typeof p.history==='object') ? p.history : {};
        if(p.v !== SCHEMA) migrate();
      }
    }
  }catch(e){ console.warn('load failed', e); }
}
function migrate(){
  // v<2: убрать старый авто-приём 28.09.2026 (пустая подпись)
  state.appointments = (state.appointments||[]).filter(a => !(a && a.date==='2026-09-28' && !(a.label && a.label.trim())));
  // v<3: исправить авто-приём 5–6 ноября → 5–6 октября (была ошибка в дате)
  state.appointments = (state.appointments||[]).map(a =>
    (a && a.date==='2026-11-05' && a.label==='5–6 ноября 2026') ? { date:'2026-10-05', label:'5–6 октября 2026' } : a);
  save(); // пересохраняем уже с актуальной версией
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(Object.assign({v:SCHEMA}, state))); }
  catch(e){ console.warn('save failed', e); toast('⚠️ Не удалось сохранить'); }
}
function isChecked(id, k){ return !!(state.history[k] && state.history[k][id]); }

/* ---- Статус пункта на конкретный день ---- */
function statusOf(task, dateKey){
  const cd = dayDiff(state.startDate, dateKey) + 1; // 1-й день курса = дата начала
  if(cd < 1) return { s:'notstarted', cd };
  if(task.duration !== null && cd > task.duration) return { s:'completed', cd };
  if(task.special === 'baziron' && cd <= 14 && cd % 2 === 0) return { s:'rest', cd }; // первые 14 дней — через день
  return { s:'active', cd };
}
/* ---- Карточка пункта ---- */
function timingTag(task){
  const m = task.timing && TIMING[task.timing];
  return m ? '<span class="ttag '+m.c+'">'+m.t+'</span>' : '';
}
function cardHTML(task, dateKey){
  const st = statusOf(task, dateKey);
  if(st.s==='active'){
    const on = isChecked(task.id, dateKey);
    let detail = task.detail;
    if(task.special==='baziron') detail += (st.cd<=14 ? ' · сегодня наносим (схема через день)' : ' · сейчас каждый день');
    let chips;
    if(task.duration===null){
      chips = '<span class="chip">ежедневно</span>';
    } else {
      const rem = task.duration - st.cd + 1; // включая сегодня
      chips = '<span class="chip">день '+st.cd+'/'+task.duration+'</span>'
            + '<span class="chip-sub">ещё '+rem+' '+daysWord(rem)+'</span>';
    }
    return '<div class="task active clickable'+(on?' on':'')+'" data-task="'+task.id+'" role="button" tabindex="0" aria-pressed="'+on+'">'
      + '<span class="check'+(on?' on':'')+'"></span>'
      + '<span class="body"><span class="nameline"><span class="name">'+task.name+'</span>'+timingTag(task)+'</span>'
      + '<span class="detail">'+detail+'</span></span>'
      + '<span class="chips">'+chips+'</span></div>';
  }
  if(st.s==='rest'){
    return '<div class="task rest"><span class="check rest">–</span>'
      + '<span class="body"><span class="name">'+task.name+'</span><span class="detail">Сегодня пропуск · схема «через день» (первые 14 дней курса)</span></span>'
      + '<span class="chips"><span class="chip muted">пропуск</span></span></div>';
  }
  if(st.s==='completed'){
    return '<div class="task done"><span class="check done"></span>'
      + '<span class="body"><span class="name">'+task.name+'</span><span class="detail">Курс завершён ✅</span></span></div>';
  }
  // notstarted
  return '<div class="task done"><span class="check"></span>'
    + '<span class="body"><span class="name">'+task.name+'</span><span class="detail">начнётся '+fmt(state.startDate,{day:'numeric',month:'long'})+'</span></span></div>';
}

/* ---- Экран «Сегодня» ---- */
function renderToday(){
  const k = todayKey(), start = state.startDate;
  const cd = dayDiff(start, k) + 1;

  let required=0, done=0;
  for(const t of TASKS){ const st=statusOf(t,k); if(st.s==='active'){ required++; if(isChecked(t.id,k)) done++; } }
  const pct = required ? Math.round(done/required*100) : 0;
  const allDone = required>0 && done===required;

  // Баннер ближайшего приёма у врача
  const na = nextAppt();
  let banner;
  if(na){
    const d = dayDiff(k, na.date);
    banner = (d===0) ? '📅 Сегодня приём у врача — '+apptText(na)
                     : '📅 Ближайший приём у врача — '+apptText(na)+' · через '+d+' '+daysWord(d);
  } else {
    banner = '📅 Приёмы у врача не запланированы — добавьте в «Настройках»';
  }

  const dateStr = cap(fmt(k,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  let dayLabel;
  if(cd<1){ const u=dayDiff(k,start); dayLabel = (u===1 ? 'Старт завтра' : 'Старт через '+u+' '+daysWord(u)); }
  else dayLabel = 'День '+cd+' курса';

  let html = '';
  html += '<div class="today-head"><div class="today-label">Сегодня</div><div class="today-date">'+dateStr+'</div><div class="daynum">'+dayLabel+'</div></div>';
  if(cd<1) html += '<div class="notice">Курс начнётся '+fmt(start)+'. С этого дня пункты станут активными. Дату можно изменить в «Настройках».</div>';
  html += '<div class="banner">'+banner+'</div>';
  html += '<div class="summary"><div class="summary-row"><span>'
        + (allDone?'🎉 Всё на сегодня выполнено':'Выполнено сегодня')
        + '</span><span>'+done+' из '+required+'</span></div>'
        + '<div class="bar"><div class="bar-fill'+(allDone?' ok':'')+'" style="width:'+pct+'%"></div></div></div>';

  for(const b of BLOCKS){
    html += '<section class="block"><div class="block-head"><span class="block-icon">'+b.icon+'</span>'
          + '<span class="block-title">'+b.title+'</span><span class="block-sub">'+b.subtitle+'</span></div>';
    if(b.note) html += '<div class="block-note">'+b.note+'</div>';
    for(const t of TASKS){ if(t.block===b.id) html += cardHTML(t, k); }
    html += '</section>';
  }
  document.getElementById('screen-today').innerHTML = html;
}

/* ---- Экран «Прогресс» ---- */
function renderProgress(){
  const k = todayKey(), start = state.startDate;
  const cd = dayDiff(start, k) + 1;
  const sub = cd<1 ? 'курс ещё не начался' : ('сегодня — день '+cd);

  let html = '<div class="p-head"><div class="date">Прогресс курса</div>'
           + '<div class="daynum">Начало '+fmt(start)+' · '+sub+'</div></div>';
  for(const m of COURSE_MEDS){
    const notStarted = cd<1;
    const finished = cd>m.duration;
    const shown = Math.max(0, Math.min(cd, m.duration));
    const pct = finished?100:(notStarted?0:Math.round(shown/m.duration*100));
    let right, psub;
    if(notStarted){
      right = 'старт '+fmt(start,{day:'numeric',month:'short'});
      psub  = 'всего '+m.duration+' '+daysWord(m.duration);
    } else if(finished){
      right = 'Завершён ✅';
      psub  = 'курс из '+m.duration+' '+daysWord(m.duration)+' пройден';
    } else {
      const rem = m.duration - cd + 1;
      right = 'осталось '+rem+' '+daysWord(rem);
      psub  = 'день '+cd+' из '+m.duration+' · последний '+fmt(addDays(start,m.duration-1),{day:'numeric',month:'long'});
    }
    html += '<div class="pcard"><div class="prow"><span class="pname">'+m.name+'</span>'
          + '<span class="pval'+(finished?' ok':'')+'">'+right+'</span></div>'
          + '<div class="bar"><div class="bar-fill'+(finished?' ok':'')+'" style="width:'+pct+'%"></div></div>'
          + '<div class="psub">'+psub+'</div></div>';
  }
  html += '<div class="p-sub">Приёмы у врача</div>';
  const appts = sortedAppts();
  if(appts.length){
    for(const a of appts){
      const past = dayDiff(todayKey(), a.date) < 0;
      html += '<div class="pcard appt'+(past?' past':'')+'"><span class="adate">'+apptText(a)+'</span>'
            + '<span class="aleft">'+apptCountdown(a)+'</span></div>';
    }
  } else {
    html += '<div class="pcard"><span class="pval muted">пока не добавлены — см. «Настройки»</span></div>';
  }
  html += '<div class="p-sub">Домашний уход · без ограничения по дням</div>';
  for(const r of ROUTINE){
    html += '<div class="pcard routine"><span class="pname">'+r+'</span><span class="pval muted">ежедневно</span></div>';
  }
  document.getElementById('screen-progress').innerHTML = html;
}

/* ---- Экран «История» ---- */
function renderHistory(){
  const k = todayKey(), start = state.startDate;
  let html = '<div class="p-head"><div class="date">История</div><div class="daynum">Журнал отметок по дням</div></div>';
  if(dayDiff(start,k) < 0){
    html += '<div class="notice">Курс ещё не начался.</div>';
    document.getElementById('screen-history').innerHTML = html;
    return;
  }
  const rows = [];
  for(let dk=k; dayDiff(start,dk)>=0; dk=addDays(dk,-1)){
    let req=0, done=0; const names=[];
    for(const t of TASKS){ const st=statusOf(t,dk); if(st.s==='active'){ req++; if(isChecked(t.id,dk)){ done++; names.push(t.name); } } }
    const cd = dayDiff(start,dk)+1;
    const okCls = (req>0 && done===req) ? ' ok' : '';
    rows.push('<details class="hday"'+(dk===k?' open':'')+'><summary>'
      + '<span class="hdate">'+cap(fmt(dk,{weekday:'short',day:'numeric',month:'long'}))+' · день '+cd+'</span>'
      + '<span class="hcount'+okCls+'">'+done+' / '+req+'</span></summary>'
      + '<div class="hbody">'+(names.length?names.map(n=>'✓ '+n).join('<br>'):'ничего не отмечено')+'</div></details>');
    if(rows.length>=200) break;
  }
  html += rows.join('');
  document.getElementById('screen-history').innerHTML = html;
}

/* ---- Экран «Настройки» ---- */
function apptRowsHTML(){
  if(!state.appointments.length) return '<div class="hint" style="margin:0 0 8px">Пока нет приёмов.</div>';
  return state.appointments.map((a,i)=>
    '<div class="apptrow" data-i="'+i+'">'
    + '<input type="date" data-field="date" value="'+esc(a.date||'')+'">'
    + '<input type="text" class="atext" data-field="label" placeholder="подпись (необяз.)" value="'+esc(a.label||'')+'">'
    + '<button class="del" data-del="'+i+'" title="Удалить приём">×</button></div>'
  ).join('');
}
function renderSettings(){
  const cd = dayDiff(state.startDate, todayKey())+1;
  const el = document.getElementById('screen-settings');
  el.innerHTML =
    '<div class="p-head"><div class="date">Настройки</div></div>'
    + '<div class="setcard"><label class="setlabel" for="startInput">Дата начала курса</label>'
    + '<input type="date" id="startInput" value="'+state.startDate+'">'
    + '<div class="hint">Сегодня — '+(cd<1?'курс ещё не начался (старт '+fmt(state.startDate,{day:'numeric',month:'long'})+')':('день '+cd+' курса'))+'.</div></div>'
    + '<div class="setcard"><div class="setlabel">Приёмы у врача</div>'
    + '<div id="apptList">'+apptRowsHTML()+'</div>'
    + '<button class="btn" id="apptAdd" style="margin-top:2px">+ Добавить приём</button>'
    + '<div class="hint">Дата и, при желании, подпись (например, «5–6 ноября»). Ближайший приём показывается на главном экране с обратным отсчётом.</div></div>'
    + '<div class="setcard"><div class="setlabel">Резервная копия</div>'
    + '<div class="btnrow"><button class="btn" id="exportBtn">⬇️ Экспорт (JSON)</button>'
    + '<button class="btn" id="importBtn">⬆️ Импорт (JSON)</button>'
    + '<input type="file" id="importFile" accept="application/json,.json" hidden></div>'
    + '<div class="hint">Данные хранятся только в этом браузере. Экспортируйте файл, чтобы не потерять журнал.</div></div>'
    + '<div class="setcard"><div class="setlabel">Сброс</div>'
    + '<button class="btn btn-danger" id="resetBtn">Удалить все данные</button></div>'
    + '<div class="about">Локальный трекер лечения<br>данные не покидают устройство</div>';

  document.getElementById('startInput').addEventListener('change', e=>{
    if(e.target.value){ state.startDate=e.target.value; save(); renderSettings(); toast('Дата начала обновлена'); }
  });
  const listEl = document.getElementById('apptList');
  listEl.addEventListener('change', e=>{
    const row=e.target.closest('.apptrow'); if(!row) return;
    const i=+row.dataset.i, f=e.target.dataset.field;
    if(f && state.appointments[i]){ state.appointments[i][f]=e.target.value; save(); }
  });
  listEl.addEventListener('click', e=>{
    const del=e.target.closest('.del'); if(!del) return;
    state.appointments.splice(+del.dataset.del, 1); save(); renderSettings(); toast('Приём удалён');
  });
  document.getElementById('apptAdd').addEventListener('click', ()=>{
    state.appointments.push({ date:todayKey(), label:'' }); save(); renderSettings();
  });
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('Удалить все данные и историю? Действие необратимо.')){
      state={ startDate:DEFAULT_START, appointments:DEFAULT_APPTS.map(a=>({...a})), history:{} };
      save(); renderSettings(); toast('Данные удалены');
    }
  });
}

/* ---- Экспорт / импорт ---- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='acne-tracker-'+todayKey()+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(r.result);
      if(!p || typeof p!=='object' || typeof p.startDate!=='string') throw new Error('bad shape');
      if(confirm('Заменить текущие данные загруженными?')){
        state.startDate = p.startDate;
        state.appointments = Array.isArray(p.appointments) ? p.appointments : DEFAULT_APPTS.map(a=>({...a}));
        state.history = (p.history && typeof p.history==='object') ? p.history : {};
        save(); go('today'); toast('Данные загружены');
      }
    }catch(err){ toast('⚠️ Не удалось прочитать файл'); }
    finally{ e.target.value=''; }
  };
  r.readAsText(file);
}

/* ---- Навигация ---- */
function go(screen){
  lastRenderedDay = todayKey();
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('hidden', s.id!=='screen-'+screen));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.screen===screen));
  if(screen==='today') renderToday();
  else if(screen==='progress') renderProgress();
  else if(screen==='history') renderHistory();
  else if(screen==='settings') renderSettings();
  window.scrollTo(0,0);
}

/* ---- Toast ---- */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---- Переключение чекбокса (делегирование) ---- */
function toggleTask(id){
  const k=todayKey();
  if(!state.history[k]) state.history[k]={};
  if(state.history[k][id]) delete state.history[k][id]; else state.history[k][id]=true;
  if(Object.keys(state.history[k]).length===0) delete state.history[k];
  save(); renderToday();
}
const todayEl = document.getElementById('screen-today');
todayEl.addEventListener('click', e=>{
  const card=e.target.closest('.task.clickable'); if(card && card.dataset.task) toggleTask(card.dataset.task);
});
todayEl.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const card=e.target.closest('.task.clickable'); if(!card) return;
  e.preventDefault(); if(card.dataset.task) toggleTask(card.dataset.task);
});

/* ---- Авто-обновление при смене реального дня (открыли вкладку на следующий день) ---- */
function maybeRefreshDay(){
  if(todayKey()!==lastRenderedDay){
    const active=document.querySelector('.tab.active');
    go(active?active.dataset.screen:'today');
  }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) maybeRefreshDay(); });
window.addEventListener('focus', maybeRefreshDay);

/* ---- Старт ---- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>go(t.dataset.screen)));
load();
go('today');
</script>
</body>
